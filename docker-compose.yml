version: '3.9'

services:
  db:
    image: postgres:15
    container_name: dealflow360_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealflow360}
      POSTGRES_USER: ${POSTGRES_USER:-dealflow360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealflow360pass}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
