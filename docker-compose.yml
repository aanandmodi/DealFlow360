version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: dealflow360_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-dealflow360}
      POSTGRES_USER: ${DB_USER:-dealflow360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dealflow360_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dealflow360}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
